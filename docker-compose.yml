services:
  postgres:
    image: postgres:16-alpine
    container_name: event-management-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "5432:5432"
    volumes:
      - event_management_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  event_management_data:
